# Codemagic configuration for building an iOS .ipa
# For more info: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/

workflows:
  flutter-app-workflow:
    name: Kisan Seva iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build ipa
        script: |
          # The --no-codesign flag builds the app without needing Apple Developer certificates.
          # The resulting .ipa will be generated in build/ios/ipa/
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - user@example.com # Replace with your email
        notify:
          success: true
          failure: true
